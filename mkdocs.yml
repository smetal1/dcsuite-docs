site_name: Podstack - DC Suite
site_description: >-
  DC Suite is a control plane for self-service GPU cloud clusters on
  bare-metal infrastructure — create clusters, run jobs, and manage the fleet.
site_author: Podstack
copyright: >-
  &copy; <a href="https://podstack.ai" target="_blank" rel="noopener">podstack.ai</a>
  — DC Suite documentation.

theme:
  name: material
  language: en
  logo: assets/podstack-logo.svg
  favicon: assets/favicon.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    # Dark is the default for EVERYONE (podstack.ai is a dark-only site), with
    # a toggle to light. No prefers-color-scheme media query, so an OS set to
    # light still lands on the branded dark theme first.
    - scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: black
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/git-alt

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

extra_css:
  - stylesheets/extra.css

extra:
  # Removes the "Made with Material for MkDocs" line from the footer.
  generator: false
  social:
    - icon: fontawesome/solid/globe
      link: https://podstack.ai
      name: podstack.ai
    - icon: fontawesome/brands/github
      link: https://github.com/smetal1/dcsuite-docs
      name: Source on GitHub

nav:
  - Home: index.md
  - User Guide:
      - user-guide/index.md
      - Getting Started: user-guide/getting-started.md
      - Core Concepts: user-guide/concepts.md
      - Creating a Cluster: user-guide/creating-clusters.md
      - Managing Clusters: user-guide/managing-clusters.md
      - Access & Networking: user-guide/access-networking.md
      - Storage & Data: user-guide/storage.md
      - Running Jobs: user-guide/jobs.md
      - Templates: user-guide/templates.md
      - Images: user-guide/images.md
      - Observability: user-guide/observability.md
      - Cost & Billing: user-guide/cost.md
      - Quotas & Limits: user-guide/quotas.md
      - Security & Isolation: user-guide/security.md
      - API Reference: user-guide/api.md
  - Operators:
      - operators/index.md
      - Architecture: operators/architecture.md
      - Installation: operators/installation.md
      - Configuration: operators/configuration.md
      - Bare-Metal Onboarding: operators/bare-metal.md
      - SSO & Identity: operators/sso.md
      - Deploys & Releases: operators/deploys.md
      - Runbooks: operators/runbooks.md
  - Reference:
      - Glossary: reference/glossary.md
      - FAQ & Troubleshooting: reference/faq.md
